name: G1 - synthetic history-secret preflight
on:
  pull_request:
    paths:
      - 'scripts/g1_history_secret_preflight.py'
      - 'tests/test_g1_history_secret_preflight.py'
      - '.github/workflows/legacy-g1-history-secret-preflight.yml'
      - 'docs/legacy/G1_HISTORY_SECRET_PREFLIGHT_RUNBOOK.md'
  push:
    branches: [main]
    paths:
      - 'scripts/g1_history_secret_preflight.py'
      - 'tests/test_g1_history_secret_preflight.py'
      - '.github/workflows/legacy-g1-history-secret-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1-history-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run only synthetic history tests (never scan real history in CI)
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_g1_history_secret_preflight.py
      # Aucun git bundle, scan historique réel, archive, clé ni upload-artifact ici.
