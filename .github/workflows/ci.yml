name: M1 Registry CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  m1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m compileall -q src
          python -m pytest -q
          python examples/first_project.py
          python -m pyprojectkit.m1.cli --help
          python -m pyprojectkit.m1.cli --demo --db /tmp/pyprojectkit-demo.sqlite init
          python -m pip wheel --no-deps -w dist .
      - name: Wheel smoke test in isolated environment (offline)
        run: |
          python -m venv .venv-wheel-smoke
          .venv-wheel-smoke/bin/python -m pip install --no-index --no-deps --find-links dist pyprojectkit
          .venv-wheel-smoke/bin/python -c "import pyprojectkit; from pyprojectkit.m1 import SqliteDatabase, RegistryService; print('isolated import: OK')"
          .venv-wheel-smoke/bin/python -m pyprojectkit.m1.cli --help
      - name: Strict static typing
        run: |
          python -m pip install "mypy>=1.12,<2"
          python -m mypy --strict --python-version 3.12 src/pyprojectkit examples/first_project.py