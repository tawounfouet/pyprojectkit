name: Reboot VS01 - isolated kernel
on:
  push:
    branches: [main, 'feat/reboot-vs01-*']
  pull_request:

permissions:
  contents: read

jobs:
  reboot-vs01:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: VS01 and G2 acceptance tests
        run: python -m pytest -q tests/test_reboot_*.py
      - name: Synthetic demonstration
        run: python examples/reboot_vs01_demo.py
      - name: Wheel install smoke test (new and legacy packages)
        run: |
          python -m pip wheel --no-deps -w /tmp/pyprojectkit-wheels .
          python -m venv /tmp/pyprojectkit-isolated
          /tmp/pyprojectkit-isolated/bin/python -m pip install --no-index --no-deps --find-links /tmp/pyprojectkit-wheels pyprojectkit
          cd /tmp
          /tmp/pyprojectkit-isolated/bin/python -c "import pyprojectkit; import pyprojectkit_next; from pyprojectkit_next import ProjectId, ProjectService; print('wheel imports OK')"
      - name: Static typing (new kernel)
        run: |
          python -m pip install 'mypy>=1.12,<2'
          python -m mypy --strict --python-version 3.12 src/pyprojectkit_next examples/reboot_vs01_demo.py
