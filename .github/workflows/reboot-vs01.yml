name: Reboot VS01 - isolated kernel
on:
  push:
    branches: ['feat/reboot-vs01-*']
  pull_request:

permissions:
  contents: read

jobs:
  reboot-vs01:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: VS01 isolated tests
        run: python -m pytest -q tests/test_reboot_vs01.py tests/test_reboot_vs01_parity.py
      - name: Synthetic demonstration
        run: python examples/reboot_vs01_demo.py
      - name: Static typing (new kernel)
        run: |
          python -m pip install 'mypy>=1.12,<2'
          python -m mypy --strict --python-version 3.12 src/pyprojectkit_next examples/reboot_vs01_demo.py
